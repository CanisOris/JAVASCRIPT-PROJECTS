 <!DOCTYPE html>
<html lang="en">

<head>
    <title>JQ Challenge</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://code.jquery.com/jquery-3.6.3.min.js"
    integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>

    <!-- serves the CSS stylesheet defining the font rules -->
    <link rel="preconnect" href="https://fonts.googleapis.com">


    <link rel="stylesheet" type="text/css" href="/JAVASCRIPT-PROJECTS/style/main.css">
    <script src="/JAVASCRIPT-PROJECTS/js1/main.js" defer></script>
    <script src="/JAVASCRIPT-PROJECTS/Basic%20JavaScript%20Projects/js1/site.js" defer></script>

    <style>
        #event-demo,
        #dotdotdot,
        #blawblaw {
            cursor: pointer;
        }
    </style>

</head>

<body id="body_style">
    <header>
        <h1 id="page-title"></h1>
    </header>

    <div class="button-grid">
        <div class="flex-box">
             <h4 class="box-title">jQuery Event Basics</h4>


            See events in console
            <p id="event-demo" style="font-size: xx-large;">Hover your mouse over me, then click me!</p>
            
        </div>

        <div class="flex-box">
             <h4 class="box-title">jQuery Introduction to Effects</h4>
            <div id="dotdotdot">This conversation will not fit in this ...</div>
            <div id="blawblaw" style="display: none;"></div>
        </div>

    </div>

    <footer></footer>

    <script>
var filler = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";


        // Wait for the HTML to fully load before attaching events
        $(document).ready(function() {
            
            // I can see where this would be useful
            // run more than 1 function !!!
            $( "#event-demo" ).on({
                "click": function() { 
                    console.log( "clicked!" ); 
                },
                "mouseover": function() { 
                    console.log( "hovered!" ); 
                }
            });


            // Add the text before showing the initially hidden content.
            $( "#blawblaw" ).text(filler);

            // Click the expanded text to hide it slowly.
            $( "#blawblaw" ).on( "click", function() {
                // this - current target
                $( this ).stop(true, true).hide( "slow" );
            });

            // Click the preview to show the full text.
            $( "#dotdotdot" ).on( "click", function() {
                $( "#blawblaw" ).stop(true, true).show( "slow" );
            });



        });
    </script>
</body>

</html>
