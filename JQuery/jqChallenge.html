<body id="body_style">
    <header>
        <h1 id="page-title"></h1>
    </header>

    <div class="button-grid">
        <div class="flex-box">
             <h4 class="box-title">jQuery Event Basics</h4>


            See events in console
            <p style="font-size: xx-large;">Hover your mouse over me, then click me!</p>
            
        </div>

        <div class="flex-box">
             <h4 class="box-title">jQuery Introduction to Effects</h4>
<p>Click on this text to hide ...</p>
<button class="reset-btn" id="showBtn">Bring Text Back</button>
            See events in console
            <p style="font-size: xx-large;">Hover your mouse over me, then click me!</p>
            
        </div>

    </div>

    <footer></footer>

    <script>
        // Wait for the HTML to fully load before attaching events
        $(document).ready(function() {
            
            // I can see where this would be useful
            // run more than 1 function !!!
            $( "p" ).on({
                "click": function() { 
                    console.log( "clicked!" ); 
                },
                "mouseover": function() { 
                    console.log( "hovered!" ); 
                }
            });


            // The ... solution, i would change the close if i had more time
            // When the paragraph is clicked, hide it slowly
            $( "p" ).on( "click", function() {
                // this - current target
                $( this ).hide( "slow" );
            });

            // Reset button
            $( "#showBtn" ).on( "click", function() {
                $( "p" ).show( "slow" );
            });



        });
    </script>
</body>
