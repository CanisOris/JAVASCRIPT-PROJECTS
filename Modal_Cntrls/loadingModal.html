<!DOCTYPE html>
<html lang="en">

<head>
    <title>Modal Loading Spinner</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- serves the CSS stylesheet defining the font rules -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- hosts the actual binary font files referenced inside that stylesheet -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- "preconnect": Tells the browser to initiate the network handshake early. 
    This performs DNS resolution, TCP handshake, and TLS negotiation ahead of time, 
    eliminating the round-trip latency when the actual font assets -->

    <link rel="stylesheet" type="text/css" href="./style/main.css">
    <link rel="stylesheet" type="text/css" href="./style/myModal.css">

</head>
