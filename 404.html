<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Outpost Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-navy: #0b1021;
            --bg-panel-dark: #152036;
            --bg-panel-light: #23314d;
            --accent-gold: #df9f43;
            --text-main: #e2e8f0;
            --text-bright: #ffffff;
            --text-gray: #7E878E;
            --border-color: #314163;
            --video-overlay: rgba(11, 16, 33, 0.7);
            --accent-glow: rgba(223, 159, 67, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep-navy);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-container {
            background-color: var(--bg-panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            color: var(--text-bright);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 0.5rem;
        }

        h1 .highlight {
            color: var(--accent-gold);
        }

        p.subtitle {
            color: var(--text-gray);
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin: 1rem 0;
            background-color: var(--bg-panel-light);
        }

        .error-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .error-image:hover {
            transform: scale(1.02);
        }

        .btn-return {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 0.875rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: center;
            box-shadow: 0 0 10px transparent;
            margin-top: 1rem;
        }

        .btn-return:hover {
            background-color: var(--accent-gold);
            color: var(--bg-deep-navy);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        
        .btn-return:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>
    <div class="error-container">
        <h1><span class="highlight">404</span> - Outpost Not Found</h1>
        
        <p class="subtitle">
            Critical failure in sector 7G. Our automated construction units have encountered an unexpected error and failed to establish the requested coordinates.
        </p>

        <div class="image-wrapper">
            <img class="error-image" src="/JAVASCRIPT-PROJECTS/images/404-moon.jpg" alt="Robots failing on the moon">
        </div>

        <a href="/JAVASCRIPT-PROJECTS/Basic%20JavaScript%20Projects/" class="btn-return">Return to Base</a>
    </div>
</body>
</html>
