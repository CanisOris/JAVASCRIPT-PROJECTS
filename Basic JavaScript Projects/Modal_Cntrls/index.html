<!DOCTYPE html>
<html lang="en">

<head>
    <title>Modals</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./style/main.css">
    <script src="./js1/main.js" defer></script>
    <script src="/JAVASCRIPT-PROJECTS/Basic%20JavaScript%20Projects/js1/site.js" defer></script>

</head>

<body id="body_style">
    <header>
        <h1 id="page-title"></h1>
    </header>

    <main>
        <div class="button-grid">

            <div class="flex-box">
                <h4 class="box-title">Assi 5 : Nested Functions Assignment</h4>
                <!-- =================================================================== -->
                <!-- SWITCH & WINDOW -->
                <!-- =================================================================== -->
                <div>
                    <!-- <button onclick="toggleModal('alertModal')">Open Modal</button> -->
                    <button onclick="toggleModal('alertModal', warningConfig)">Open Warning Modal</button>

                    <!-- The Modal Background (Hidden by default) -->
                    <!-- TOGGLE ON/OFF -->
                    <div id="alertModal" class="modal">
                        <!-- Modal Box -->
                        <div class="modal-content">
                            <h2>Process Complete</h2>
                            <p>Your calculation has finished successfully.</p>

                            <!-- Toggle off/close -->
                            <button onclick="toggleModal('alertModal')">Close</button>
                        </div>
                    </div>

                </div>
            </div>
            <div class="flex-box">
                <!-- =================================================================== -->
                <!-- SWITCH & WINDOW -->
                <!-- =================================================================== -->
                <div>
                    <!-- <button onclick="toggleModal('alertModal2')">Open Modal</button> -->
                    <button onclick="toggleModal('alertModal2', sidePanelConfig)">Open Side Panel Modal</button>

                    <!-- The Modal Background (Hidden by default) -->
                    <!-- TOGGLE ON/OFF -->
                    <div id="alertModal2" class="modal">
                        <!-- Modal Box -->
                        <div class="modal-content">
                            <h2>Process Complete</h2>
                            <p>Your calculation has finished successfully.</p>

                            <!-- Toggle off/close -->
                            <button onclick="toggleModal('alertModal2')">Close</button>
                        </div>
                    </div>

                </div>

            </div>


    </main>

    <footer></footer>
</body>

</html>
