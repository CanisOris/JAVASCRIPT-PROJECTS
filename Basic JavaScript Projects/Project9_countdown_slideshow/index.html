<!DOCTYPE html>
<html lang="en">

<head>
    <title>js stuff</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ================================================== -->
    <link rel="stylesheet" type="text/css" href="./style/CSS_File.css">
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" type="text/css" href="./style/slideshow.css">
    <script src="./js/slideshow.js" defer></script>

    <style>
        .slideshow-container {
            max-width: 800px;
        }
    </style>

</head>

<body id="body_style">
    <header>
        <h1>Project9_countdown_slideshow</h1>
    </header>

    <main>
        <div class="button-grid">
            <div class="flex-box">
                <p>How many seconds would you like to set your alarm for?</p>
                <input id="seconds" value="" style="margin-bottom: 12px;"/>
                <button onclick="countdown()">Click Here</button>
                <p id="timer"></p>
            </div>

        </div>

        <div class="slideshow-container">

            <!-- Full-width images with number and caption text -->
            <div class="mySlides fade">
                <div class="numbertext">1 / 4</div>
                <img src="./images/ms1.jpg">
                <div class="text">Moose & Sol when mouse was young</div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">2 / 4</div>
                <img src="./images/ms2.jpg">
                <div class="text">Moose & Sol on top</div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">3 / 4</div>
                <img src="./images/ms3.jpg">
                <div class="text">Moose & Sol cooling off</div>
            </div>

            <div class="mySlides fade">
                <div class="numbertext">4 / 4</div>
                <img src="./images/ms4.jpg">
                <div class="text">Moose & Sol cooling off</div>
            </div>

            <!-- Next and previous buttons -->
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>

        <!-- The dots/circles -->
        <div style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
        </div>




    </main>

    <footer></footer>
</body>

</html>
