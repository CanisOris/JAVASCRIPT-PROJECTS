<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Basic AJAX Demo</title>
	<!-- The stylesheet controls the layout, typography, and button appearance. -->
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<div class="container">
		<h1>Sign up for our Newsletter</h1>
		<!-- These buttons use type="button" so the form does not submit or refresh the page.
		     Both call the AJAX examples in ajaxScript.js, which request response.html. -->
		<div class="display">
			<form>
				<input id="fullName" placeholder="Name">
				<input placeholder="Email">
				<input onclick="getMsg();" type="button" class="btn" value="Submit Msg1"/>
				<input onclick="getMsg2();" type="button" class="btn" value="Submit Msg2"/>
			</form>
		</div>
		<!-- AJAX replaces this initial paragraph with the downloaded HTML fragment.
		     Keeping the form outside this region lets you try either button again. -->
		<div id="content" aria-live="polite">
			<p>Click a Submit button to load our newsletter message.</p>
		</div>
		<!-- Request failures are shown separately so the original content remains available. -->
		<p id="requestStatus" role="status"></p>
	</div>
	<!-- Load the script after the HTML so the form and output elements already exist. -->
	<script src="./ajaxScript.js"></script>
</body>
</html>
