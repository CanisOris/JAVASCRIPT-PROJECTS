<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Basic AJAX Demo</title>
	<!-- The stylesheet controls the layout, typography, and button appearance. -->
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<div class="container">
		<h1>Sign up for our Newsletter</h1>
		<!-- type="button"  does not submit or refresh the page. -->
		<div class="display">
			<form>
				<input id="fullName" placeholder="Name">
				<input placeholder="Email">
				<input onclick="getMsg();" type="button" class="btn" value="Load Newsletter"/>
				<input onclick="getMsg2();" type="button" class="btn" value="Sign Up"/>
			</form>
		</div>
		<!-- ajax replace section -->
		<div id="content" aria-live="polite">
			<p>Load the newsletter, or enter your name and click Sign Up for a personalized message.</p>
		</div>
		<!-- request failures msg -->
		<p id="requestStatus" role="status"></p>
	</div>
	<!-- load late after form  -->
	<script src="./ajaxScript.js?v=3"></script>
</body>
</html>
