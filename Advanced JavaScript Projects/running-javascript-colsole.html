    <script>
        // global vars
        let a = 3;
        let b = 4;

        function global() {
            result = a + b;
            document.getElementById("globalVariables").innerText =
                `Global variale a (${a}) plus global variable b (${b}) equals ${result}`;
        }

        function local() {
            let c = 4;
            let d = 3;
            result = c + d;
            document.getElementById("localVariables").innerText =
                `Global variale c (${c}) plus global variable d (${d}) equals ${result}`;
        }

        function Course(Name, Type, Duration) {
            try {

                    throw new Error("Missing parameters");
                }
                this.courseName = `Cousrse Name: ${Name}`;
                this.courseType = `Type: ${Type}`;
                this.courseDur = `Length: ${Duration} hours`;
            } catch (error) {
                document.getElementById("displayCourse").innerText = "Required Console Input!!!";
            }
        }

        let js = new Course("JavaScirpt", "Code", 55);
