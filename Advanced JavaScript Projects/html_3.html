<!DOCTYPE html>
<html lang="en">

<head>
    <title>Data Attribute</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./style/main.css">
    <link rel="stylesheet" type="text/css" href="./style/form.css">
    <link rel="stylesheet" type="text/css" href="./style/color.css">

    <script src="./js1/main.js" defer></script>
    <script src="./js1/JavaScript_3.js" defer></script>
    <script src="/JAVASCRIPT-PROJECTS/Basic%20JavaScript%20Projects/js1/site.js" defer></script>

</head>

<body id="body_style">
    <header>
        <h1 id="page-title"></h1>
    </header>

    <div class="button-grid">
        <div class="flex-box">
            <form id="form-generic-edit" class="Contact_Form"  novalidate autocomplete="off">
                <p class="Form_Intro">Use Data Attributes to set original values.  Sometimes with multiple users you need the original values</p>
                <div class="Form_Field">
                    <label for="field1">Field1</label>
                    <input type="text" id="field1" name="Name" data-original-value="Dog" autocomplete="name" placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error1">Data Required.</span>
                </div>
                <div class="Form_Field">
                    <label for="field2">Field2</label>
                    <input type="text" id="field2" name="Name" data-original-value="Cat" autocomplete="name" placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error2">Data Required.</span>
                </div>
                <div class="Form_Field">
                    <label for="field3">Field3</label>
                    <input type="text" id="field3" name="Name" data-original-value="Bird" autocomplete="name" placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error3">Data Required.</span>
                </div>
           
                <div id="form-status"></div>
                <button class="form-button-submit" type="submit">Submit<span aria-hidden="true"></span></button>
            </form>
            <div id="formOut"></div>
        </div>
    </div>
    <footer></footer>
</body>

</html>
