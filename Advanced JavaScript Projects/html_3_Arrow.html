<!DOCTYPE html>
<html lang="en">

<head>
    <title>Arrow Function Challenge</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./style/main.css">
    <link rel="stylesheet" type="text/css" href="./style/form.css">
    <link rel="stylesheet" type="text/css" href="./style/color.css">

    <script src="./js1/main.js" defer></script>

    <script src="/JAVASCRIPT-PROJECTS/Basic%20JavaScript%20Projects/js1/site.js" defer></script>

</head>
<script>

    // .map(field => field.name)
    // ---- these are equal
    // .map(function(field) {
    //     return field.name;
    // })
// 

    function getFieldNames(form) {
        return Array.from(form.querySelectorAll('input, select, textarea'))
            .map(function (field) {
                return field.name;
            });
    }

    const getFieldNamesArrow = (form) => {
        return Array.from(form.querySelectorAll('input, select, textarea'))
            .map((field) => {
                return field.name;
            });
    };
</script>

<body id="body_style">
    <header>
        <h1 id="page-title"></h1>
    </header>

    <div class="button-grid">
        <div class="flex-box">
            <form id="form-generic-edit" class="Contact_Form" novalidate autocomplete="off">
                <p class="Form_Intro">Scan the form using arrow function and not<br>
                    It seems to be more about readablility. </p>

                <div class="Form_Field">
                    <label for="field1">Field1</label>
                    <input type="text" id="field1" name="Rock" data-original-value="Dog" autocomplete="name"
                        placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error1">Data Required.</span>
                </div>
                <div class="Form_Field">
                    <label for="field2">Field2</label>
                    <input type="text" id="field2" name="Paper" data-original-value="Cat" autocomplete="name"
                        placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error2">Data Required.</span>
                </div>
                <div class="Form_Field">
                    <label for="field3">Field3</label>
                    <input type="text" id="field3" name="Scissors" data-original-value="Bird" autocomplete="name"
                        placeholder="Generic Input" class="form-input-text" form-required>
                    <span class="form-error-message hidden" id="input-error3">Data Required.</span>
                </div>

                <div id="form-status"></div>
                <!-- <button class="form-button-submit" type="submit">Submit<span aria-hidden="true"></span></button> -->

                <!--**snip(4) .join(', '); join list with commas-->
                <button type="button"
                    onclick="document.getElementById('formOut').textContent = getFieldNames(document.getElementById('form-generic-edit')).join(', ');">
                    Regular function
                </button>

                <button type="button"
                    onclick="document.getElementById('formOut').textContent = getFieldNamesArrow(document.getElementById('form-generic-edit')).join(', ');">
                    Arrow function
                </button>
            </form>
            <div id="formOut"></div>
        </div>
    </div>
    <footer></footer>
</body>

</html>
